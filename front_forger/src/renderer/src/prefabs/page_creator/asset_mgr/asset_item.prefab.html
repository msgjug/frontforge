<style>
    .asset-item {
        border-bottom: 1px gray dashed;
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        height: 23px;
        position: relative;
    }

    .asset-item:hover {
        background: rgba(255, 255, 255, 0.5);
    }

    .asset-item:first-child {
        border-top: 1px gray dashed;
        border-bottom: 1px gray dashed;
    }

    .asset-item[cur] {
        background: #f7922c;
    }

    .asset-item[start] {
        /* border: 3px dashed #2cc1f7; */
    }

    .asset-item .emoji-btn {
        font-size: 1em;
        padding: 0;
    }

    .asset-item-desc {
        display: none;
        /* pointer-events: none; */
    }

    .asset-item:hover .asset-item-desc {
        display: flex;
    }
</style>
<dom>
    <div @click="onClick" class="asset-item" draggable="true">
        <div class="row">
            <img $="imgIcon" src="icon-file.png" style="height:1em;" />
            <div $="lbName">asset_name</div>
        </div>
        <div $="iconPersist" style="display:none;">📌</div>
        <div $="iconStart" style="display:none;">🚩</div>
        <div $="prefabInfo" style="display: none; position: absolute; right: 0;">
            <div $="assetItemDesc" class="row asset-item-desc">
                <div style="
            background: rgba(255,255,255,0.8);
            color:black;" $="lbDesc"></div>
                <input $="ebDesc" style="display:none" $="ebDesc" value="" />
                <button @click="onClickEditDesc" class="emoji-btn-static">🏷️</button>
            </div>
        </div>
    </div>
</dom>
