<style>
    .asset-group {
        border: 1px solid white;
        border-radius: 0.5em;
        background: rgba(0, 0, 0, 0.5);
        margin-top: 0.5em;
    }
    .asset-group[internal] {
        border: 1px solid white;
        border-radius: 0.5em;
        background: rgba(0, 0, 100, 0.5);
        margin-top: 0.5em;
    }

    .asset-group[drag-over]{
        /* background:red; */
    }

    .asset-group:first-child {}

    .asset-group-btn-fold {
        /* border-radius: 15px; */
        /* height: 2em; */
        width: 2em;
        padding: 0;
        background: none;
        color: white;
        border: none;
    }

    .asset-group-title {
        cursor: pointer;
        font-weight: bold;
        color:#7baac1;
    }
</style>
<dom>
    <div class="asset-group" @drop="onItemDrop">
        <div class="row" style="justify-content: space-between;" @click="onToggleFold">
            <div $="lbName" class="asset-group-title" style="flex-grow: 1;">group_name</div>
            <div class="row" style="align-items: baseline;">
                <div $="lbItemCount" style="font-size:0.8em">0</div>
                <button class="asset-group-btn-fold" $="btnFold">-</button>
            </div>
        </div>
        <div $="contain" style="overflow-y: hidden; transition: height 0.2s ease-in-out;">
        </div>
    </div>
</dom>
