<style>
    .tab-view {
    }

    .tab-contain {
        display: flex;
        background-color: #c0c0c0;
        border-bottom: 1px solid black;
    }

    .tab-link {
        border-radius: 0.5em;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;

        padding:0.5em;
        cursor:default;
        transition: background-color 0.3s;
        border: 1px solid rgb(67, 67, 67);
        border-bottom: none;
    }

    .tab-link:hover {
        background-color: #fff;
    }

    .tab-link[cur] {
        background-color: #fff;
        z-index: 2;
        border-bottom: 1px solid white;
        margin-bottom: -1px;
    }

    .page-contain {
        border: 1px solid black;
        border-top: none;
    }

    .page {
        flex-grow: 1;
        display: none;
        padding: 0.5em;
        background: white;
    }
</style>
<dom>
    <div class="row">
        <div class="tab-view" style="flex-grow: 1;">
            <div $="linkContain" class="tab-contain">
                <div class="tab-link" @click="openTab(0)" cur>Tab 1</div>
                <div class="tab-link" @click="openTab(1)">Tab 2</div>
                <div class="tab-link" @click="openTab(2)">Tab 3</div>
            </div>
            <div class="page-contain" $="pageContain">
                <div class="page">
                    <p>内容 1</p>
                </div>
                <div class="page">
                    <p>内容 2</p>
                </div>
                <div class="page">
                    <p>内容 3</p>
                </div>
            </div>
        </div>
    </div>
</dom>
