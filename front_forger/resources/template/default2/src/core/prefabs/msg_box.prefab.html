<style>
    .msg-box {
        flex-direction: column;
        align-items: center;
        justify-content: space-around;
        display: flex;
    }
</style>

<dom node="MsgBox">
    <div class="panel-bg">
        <div @click="onClickBlockInput" class="panel">
            <div $="nav" class="nav">
                <div $="lbTitle">
                </div>
                <div>
                    <button @click="onClickOk">X</button>
                </div>
            </div>
            <div class="panel-contain msg-box">
                <div $="lbText" style="word-break:break-all; padding:1em"> </div>
                <button style="padding:1em" @click="onClickOk">ok</button>
            </div>
        </div>
    </div>
</dom>
